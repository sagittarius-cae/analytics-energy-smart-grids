services:
  # Service 1: Core Python Analytics Environment (JupyterLab)
  jupyter-workspace:
    build: .
    container_name: python_jupyter_analyst
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace
      - ./data:/workspace/data
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace 
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --ServerApp.token='' --ServerApp.password='' --IdentityProvider.token=''


  # Service 2: The DuckDB Local Graphical UI App
  duckdb-ui:
    image: ghcr.io/ibero-data/duck-ui:latest
    container_name: local_duckdb_ui
    ports:
      - "5522:5522"
    volumes:
      - ./database:/data
      - ./data:/workspace/data
    restart: always

  # Service 3: Base de datos para la metadata de Airflow
  airflow-postgres:
    image: postgres:13
    container_name: analytics_airflow_db
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - ./airflow_metadata:/var/lib/postgresql/data
    restart: always

  # Service 4: Airflow Webserver (Interfaz Gráfica)
  airflow-webserver:
    build: .  
    container_name: analytics_airflow_webserver
    restart: always
    depends_on:
      - airflow-postgres
    ports:
      - "8085:8080"
    volumes:
      - .:/workspace               
      - ./data:/workspace/data     
      - ./database:/workspace/database 
      - ./dags:/workspace/dags        
      - ./airflow_home:/workspace/airflow_home
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace
      - AIRFLOW_HOME=/workspace/airflow_home
      - AIRFLOW__CORE__DAGS_FOLDER=/workspace/dags
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_USER_HOME_DIR=/workspace
    command: >
      bash -c "airflow db upgrade && 
               airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com || true &&
               exec airflow webserver"

  # Service 5: Airflow Scheduler (El motor que ejecuta las tareas)
  airflow-scheduler:
    build: .  
    container_name: analytics_airflow_scheduler
    restart: always
    depends_on:
      - airflow-postgres
    volumes:
      - .:/workspace               
      - ./data:/workspace/data     
      - ./database:/workspace/database 
      - ./dags:/workspace/dags        
      - ./airflow_home:/workspace/airflow_home # Comparte la misma persistencia de configuración que el webserver
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace
      - AIRFLOW_HOME=/workspace/airflow_home
      - AIRFLOW__CORE__DAGS_FOLDER=/workspace/dags
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    # Pequeño retraso inicial (sleep 5) para dar tiempo a que el Webserver ejecute el 'db upgrade'
    command: bash -c "sleep 5 && exec airflow scheduler"
